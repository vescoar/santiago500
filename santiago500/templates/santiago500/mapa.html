{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smog en Santiago</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f6f7f5;
      --ink: #1d2320;
      --muted: #5b6661;
      --line: #d9ddd9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; flex-wrap: wrap;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    #estado { font-size: .85rem; color: var(--muted); }
    #estado.error { color: #b3261e; }
    #mapa { flex: 1; min-height: 0; }

    .etiqueta {
      width: 40px; text-align: center;
      font-weight: 700; font-size: .85rem; color: #111;
      text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 3px #fff;
      pointer-events: none;
    }
    .leyenda {
      background: #fff; padding: 8px 10px; border-radius: 6px;
      font-size: .78rem; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .leyenda i {
      display: inline-block; width: 12px; height: 12px;
      border-radius: 3px; margin-right: 6px; vertical-align: -1px;
    }
    .popup-nombre { font-weight: 600; margin-bottom: 2px; }
    .popup-meta { color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Calidad del aire por comuna, Santiago</h1>
    <span id="estado">Cargando datos...</span>
  </header>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    
    const NIVELES = [
      [50,  "#2e9e5b", "Bueno"],
      [100, "#f4d03f", "Moderado"],
      [150, "#f39c34", "Dañino para grupos sensibles"],
      [200, "#d6334a", "Dañino"],
      [300, "#7b2d8e", "Muy dañino"],
      [Infinity, "#6e1423", "Peligroso"],
    ];
    const nivel = aqi => NIVELES.find(n => aqi <= n[0]);

    const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    const esc = s => String(s).replace(/[&<>"']/g, c => (
      {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]
    ));

    
    function areaAnillo(r) {
      let s = 0;
      for (let i = 0; i < r.length; i++) {
        const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length];
        s += x1 * y2 - x2 * y1;
      }
      return s / 2;
    }
    function centroide(geom) {
      const polis = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
      let anillo = null, mayor = 0;
      polis.forEach(p => {
        const a = Math.abs(areaAnillo(p[0]));
        if (a > mayor) { mayor = a; anillo = p[0]; }
      });
      const a = areaAnillo(anillo);
      let cx = 0, cy = 0;
      for (let i = 0; i < anillo.length; i++) {
        const [x1, y1] = anillo[i], [x2, y2] = anillo[(i + 1) % anillo.length];
        const cruz = x1 * y2 - x2 * y1;
        cx += (x1 + x2) * cruz;
        cy += (y1 + y2) * cruz;
      }
      return [cy / (6 * a), cx / (6 * a)]; // [lat, lon]
    }

    const mapa = L.map("mapa").setView([-33.48, -70.65], 10);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  referrerPolicy: "strict-origin-when-cross-origin",
  attribution: "&copy; OpenStreetMap | Datos: Open-Meteo (modelo)",
}).addTo(mapa);

    
    const leyenda = L.control({ position: "bottomright" });
    leyenda.onAdd = () => {
      const div = L.DomUtil.create("div", "leyenda");
      div.innerHTML = NIVELES.map((n, i) => {
        const desde = i === 0 ? 0 : NIVELES[i - 1][0] + 1;
        const rango = n[0] === Infinity ? `${desde}+` : `${desde}-${n[0]}`;
        return `<div><i style="background:${n[1]}"></i>${rango} ${n[2]}</div>`;
      }).join("");
      return div;
    };
    leyenda.addTo(mapa);

    const estado = document.getElementById("estado");
    const etiquetas = L.layerGroup();
const ZOOM_ETIQUETAS = 10;  
function actualizarEtiquetas() {
  if (mapa.getZoom() >= ZOOM_ETIQUETAS) {
    if (!mapa.hasLayer(etiquetas)) etiquetas.addTo(mapa);
  } else if (mapa.hasLayer(etiquetas)) {
    mapa.removeLayer(etiquetas);
  }
}
mapa.on("zoomend", actualizarEtiquetas);
actualizarEtiquetas();
    let datos = {};          
    let capaComunas = null;

    const estilo = feature => {
      const e = datos[norm(feature.properties.nombre)];
      return {
        fillColor: e ? nivel(e.aqi)[1] : "#c9cdca",
        fillOpacity: 0.72,
        color: "#ffffff",
        weight: 1.5,
      };
    };

    const geoPromesa = fetch("{% static 'santiago500/comunas.geojson' %}").then(r => {
      if (!r.ok) throw new Error("Falta comunas.geojson. Ejecuta preparar_comunas.py");
      return r.json();
    });

    async function cargar() {
      try {
        const [geo, resp] = await Promise.all([geoPromesa, fetch("{% url 'api_estaciones' %}")]);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const api = await resp.json();

        datos = {};
        api.estaciones.forEach(e => { datos[norm(e.nombre)] = e; });

        if (!capaComunas) {
          capaComunas = L.geoJSON(geo, {
            style: estilo,
            onEachFeature: (f, layer) => {
              layer.on("mouseover", () => layer.setStyle({ weight: 3 }));
              layer.on("mouseout", () => capaComunas.resetStyle(layer));
            },
          }).addTo(mapa);
          mapa.fitBounds(capaComunas.getBounds());
        }

        etiquetas.clearLayers();
        capaComunas.eachLayer(layer => {
          const f = layer.feature;
          const e = datos[norm(f.properties.nombre)];
          capaComunas.resetStyle(layer);

          if (!e) {
            layer.bindPopup(`<div class="popup-nombre">${esc(f.properties.nombre)}</div><div>Sin datos</div>`);
            return;
          }
          layer.bindPopup(
            `<div class="popup-nombre">${esc(f.properties.nombre)}</div>` +
            `<div>AQI ${e.aqi}: ${nivel(e.aqi)[2]}</div>` +
            `<div class="popup-meta">Medido ${esc(e.medido_en)}</div>`
          );
          L.marker(centroide(f.geometry), {
            interactive: false,
            icon: L.divIcon({
              className: "",
              html: `<div class="etiqueta">${e.aqi}</div>`,
              iconSize: [40, 20],
              iconAnchor: [20, 10],
            }),
          }).addTo(etiquetas);
        });

        if (api.estaciones.length === 0) {
          estado.className = "error";
          estado.textContent = "No hay datos disponibles todavía.";
        } else if (api.aviso) {
          estado.className = "error";
          estado.textContent = "No se pudo actualizar, mostrando los últimos datos guardados.";
        } else {
          estado.className = "";
          estado.textContent = `${api.estaciones.length} comunas. Actualizado ${new Date().toLocaleTimeString("es-CL", {hour: "2-digit", minute: "2-digit"})}`;
        }
      } catch (err) {
        estado.className = "error";
        estado.textContent = err.message || "No se pudo cargar el mapa.";
      }
    }

    cargar();
    setInterval(cargar, 10 * 60 * 1000);
  </script>
</body>
</html>
